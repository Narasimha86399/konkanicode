<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8" />
  <title>Devanagari to Konkani Transliteration</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      margin: 0;
      background-color: #f5f5f5;
    }

    header {
      text-align: center;
      padding: 20px 10px;
      background-color: #80004d;
      color: white;
      border-radius: 8px 8px 0 0;
    }

    .Konkani-logo {
      width: 120px;
      height: auto;
      margin-bottom: 10px;
      border-radius: 50%;
      background-color: white;
      padding: 5px;
    }

    h1 {
      font-size: 36px;
      margin: 0;
    }

    nav {
      background-color: #f2f2f2;
      text-align: center;
      padding: 12px;
      margin-bottom: 20px;
      border-bottom: 2px solid #ccc;
    }

    nav a {
      color: #80004d;
      margin: 0 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      transition: color 0.3s;
    }
    
    nav a:hover {
      color: #b30066;
    }

    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 15px;
      padding: 15px;
      font-size: 18px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    footer {
      background-color: #80004d;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      border-radius: 0 0 8px 8px;
    }

    .OutputText {
      font-size: 24px;
      padding: 10px;
      white-space: pre-wrap;
      background: #ffffff;
      min-height: 100px;
      border: 2px solid #80004d;
    }

    .font-selector {
      margin: 10px 0 20px;
    }

    select {
      padding: 8px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #80004d;
    }

    .copy-button {
      padding: 10px 20px; 
      font-size: 16px; 
      background-color: #80004d; 
      color: white; 
      border: none; 
      border-radius: 5px; 
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .copy-button:hover {
      background-color: #a30066;
    }
  </style>
</head>
<body>
  <header>
    <img src="kundapura.jpg" alt="Konkani-logo" class="Konkani-logo">
    <h1>Konkan</h1>
  </header>

  <nav>
    <a href="index.html">Konkani Letters</a> 
    <a href="konkani-transliterate.html">Devanagari Fonts To Konkani Fonts</a> 
    <a href="flashcard.html">Flashcards</a>
    <a href="konkaniwords.html">Konkani Words</a>
  </nav>

  <h2>Devanagari Fonts To Konkani Transliteration</h2>

  <textarea id="inputText" placeholder="Type Devanagari text..."></textarea>

  <div class="font-selector">
    <label for="fontSelect"><strong>Choose Konkani Font:</strong> </label>
    <select id="fontSelect" onchange="changeFont()">
      <option value="Mallige">Mallige (Fallback: Times New Roman)</option>
      <option value="Mandara">Mandara (Fallback: Arial)</option>
    </select>
  </div>

  <h2>In Konkani Script :</h2>
  <textarea id="outputText" class="OutputText" readonly placeholder="Konkani lipiyalli..." style="font-family: 'Times New Roman', serif;"></textarea>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <button onclick="copyOutput(this)" class="copy-button">Copy Output</button>
  </div>

  <footer>
    &copy; 2025 Konkan Transliteration
  </footer>

  <script>
    const mapping = {
      'अ': 'A', 'आ': 'À', 'इ': 'I', 'ई': 'Ì', 'उ': 'U', 'ऊ': 'Ù',
      'ऋ': 'R',
      'ए': 'E', 'ऐ': 'È', 'ओ': 'O', 'औ': 'Ò',
      'क': 'k', 'ख': 'K', 'ग': 'g', 'घ': 'G', 'ङ': 'Z',
      'च': 'c', 'छ': 'C', 'ज': 'j', 'झ': 'J', 'ञ': 'z',
      'ट': 'q', 'ठ': 'Q', 'ड': 'w', 'ढ': 'W', 'ण': 'N',
      'त': 't', 'थ': 'T', 'द': 'd', 'ध': 'D', 'न': 'n',
      'प': 'p', 'फ': 'P', 'ब': 'b', 'भ': 'B', 'म': 'm',
      'य': 'y', 'र': 'r', 'ल': 'l', 'ळ': 'L', 'व': 'v',
      'श': 'S', 'ष': 'x', 'स': 's', 'ह': 'h',
      'ा': 'a', 'ि': 'i', 'ी': 'F', 'ु': 'u', 'ू': 'X',
      'ृ': 'à', 'े': 'e', 'ै': 'áe',
      'ो': 'ea', 'ौ': 'áea',
      'ं': 'M', 'ः': 'H', '्': 'f', 'ॅ': 'ä', 'ॉ': 'äa',

      // Standalone half-consonants
      'क्': 'V', 'ग्': 'Ã', 'च्': 'Â', 'ज्': 'Æ', 'ण्': 'Î', 'त्': 'Ú',
      'न्': 'Í', 'प्': 'Ï', 'म्': 'Ë', 'र्': 'Á',
      'ल्': 'o', 'व्': 'Û', 'श्': 'Ö', 'ष्': 'Õ', 'स्': 'Ô',
      'ह्': 'Ä', 'ळ्': 'Ê', 
      
      // Fixed conjunct ligatures
      'क्ष': 'Y', 'ङ्क': 'è', 'ङ्ग': 'Ü', 'ज्ञ': 'Å'
    };

    const CONSONANTS = 'कखगघङचछजझञटठडढणतथदधनपफबभमयरलळवशषसह';
    const isConsonant = (ch) => CONSONANTS.includes(ch);
    const isMatra = (ch) => Boolean(ch && /[ािीुूृेैोौँंःॅॉ]/.test(ch));

    // Formats matras correctly around base glyphs (including pre-posed matras like e, i)
    function applyMatra(base, matra) {
      if (!matra) return base;
      if (matra === 'ि') return (mapping['ि'] || 'i') + base;
      if (matra === 'े') return 'e' + base;
      if (matra === 'ै') return 'áe' + base;
      if (matra === 'ो') return 'e' + base + 'a';
      if (matra === 'ौ') return 'áe' + base + 'a';
      if (mapping[matra]) return base + mapping[matra];
      return base + matra;
    }

    function transliterate(text) {
      if (!text) return '';

      // Clean zero-width chars and normalize literal 'क् + र' or 'क्+र' to 'क्र'
      text = text.replace(/[\u200B-\u200D\uFEFF]/g, '');
      text = text.replace(/([क-ह]्)\s*\+\s*([क-ह])/g, '$1$2');

      const chars = [...text];
      let result = '';

      for (let i = 0; i < chars.length; i++) {
        const cur = chars[i];
        const next = chars[i + 1] || '';
        const third = chars[i + 2] || '';
        const fourth = chars[i + 3] || '';
        // Rule: र् + any consonant -> Consonant + 'Á' (e.g., र्क -> kÁ, र्म -> mÁ)
if (cur === 'र' && next === '्' && isConsonant(third)) {
  const base = (mapping[third] || third) + 'Á';
  if (isMatra(fourth)) {
    result += applyMatra(base, fourth);
    i += 3; // consume 'र', '्', third, and fourth (matra)
  } else {
    result += base;
    i += 2; // consume 'र', '्', and third
  }
  continue;
}

        // 1. Any Consonant + ् + र -> 'Ç' + Consonant (e.g., क्+र -> Çk, प्+र -> Çp)
        if (isConsonant(cur) && next === '्' && third === 'र') {
          const base = 'Ç' + (mapping[cur] || cur);
          if (isMatra(fourth)) {
            result += applyMatra(base, fourth);
            i += 3;
          } else {
            result += base;
            i += 2;
          }
          continue;
        }

        // 2. Any Consonant + ् + य -> Consonant + 'É' (e.g., क्+य -> kÉ, प्+य -> pÉ)
        if (isConsonant(cur) && next === '्' && third === 'य') {
          const base = (mapping[cur] || cur) + 'É';
          if (isMatra(fourth)) {
            result += applyMatra(base, fourth);
            i += 3;
          } else {
            result += base;
            i += 2;
          }
          continue;
        }

        // 3. Multi-character conjuncts from mapping (e.g., क्ष, ज्ञ, ङ्क, ङ्ग)
        if (next && third) {
          const threeChar = cur + next + third;
          if (mapping[threeChar]) {
            const base = mapping[threeChar];
            if (isMatra(fourth)) {
              result += applyMatra(base, fourth);
              i += 3;
            } else {
              result += base;
              i += 2;
            }
            continue;
          }
        }

        // 4. Two-character conjuncts / half-letters from mapping (e.g., क् -> V, र् -> Á)
        if (next) {
          const twoChar = cur + next;
          if (mapping[twoChar]) {
            result += mapping[twoChar];
            i += 1;
            continue;
          }
        }

        // 5. Consonants with following matra
        if (isConsonant(cur)) {
          const base = mapping[cur] || cur;
          if (isMatra(next)) {
            result += applyMatra(base, next);
            i += 1;
            continue;
          }
          result += base;
          continue;
        }

        // 6. Independent vowels, digits, punctuation, and fallback
        result += mapping[cur] || cur;
      }

      return result;
    }

    document.getElementById('inputText').addEventListener('input', () => {
      const input = document.getElementById('inputText').value;
      document.getElementById('outputText').value = transliterate(input);
    });

    function changeFont() {
      const font = document.getElementById('fontSelect').value;
      const outputBox = document.getElementById('outputText');
      if (font === 'Mallige') {
        outputBox.style.fontFamily = `'Times New Roman', serif`;
      } else if (font === 'Mandara') {
        outputBox.style.fontFamily = `'Arial', sans-serif`;
      }
    }

    function copyOutput(button) {
      const outputBox = document.getElementById("outputText");
      outputBox.select();
      outputBox.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(outputBox.value).then(() => {
        const originalText = button.textContent;
        button.textContent = "✅ Translated!";
        button.style.backgroundColor = "#008000";
        setTimeout(() => {
          button.textContent = originalText;
          button.style.backgroundColor = "#80004d";
        }, 1500);
      }).catch(err => {
        console.error('Could not copy text: ', err);
        alert("Failed to copy text.");
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      changeFont();
    });
  </script>
</body>
</html>
